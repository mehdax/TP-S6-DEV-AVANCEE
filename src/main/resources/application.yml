spring:
  application:
    name: master-annonce
  datasource:
    url: jdbc:postgresql://localhost:5432/masterannonce
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      indent_output: true
      fail_on_empty_beans: false

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.univ_paris8.iut.montreuil.qdev.tp2025.gr07jeuquizz.tps6: DEBUG

# JWT Configuration
app:
  jwt:
    secret: "votre_cle_secrete_tres_longue_et_tres_secure_pour_master_annonce_2025"
    expirationMs: 3600000 # 1 heure

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
