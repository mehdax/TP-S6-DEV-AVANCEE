/**
 * Configuration JAAS pour MasterAnnonce.
 * 
 * Deux domaines d'authentification :
 * 1. MasterAnnonceLogin : authentification username/password via la BDD
 * 2. MasterAnnonceToken : authentification par token (par requête)
 * 
 * Activation : ajouter l'option JVM au démarrage de Tomcat :
 *   -Djava.security.auth.login.config=/chemin/vers/jaas.conf
 *
 * Note : ce fichier est un fichier de configuration JAAS standard (pas Java).
 * L'extension .conf est utilisée par convention.
 */
MasterAnnonceLogin {
    org.univ_paris8.iut.montreuil.qdev.tp2025.gr07jeuquizz.tps6.jaas.DbLoginModule required
    debug=false;
};

MasterAnnonceToken {
    org.univ_paris8.iut.montreuil.qdev.tp2025.gr07jeuquizz.tps6.jaas.TokenLoginModule required
    debug=false;
};
