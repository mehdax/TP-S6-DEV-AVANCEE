/*
 * Configuration JAAS – MasterAnnonce
 *
 * Deux domaines d'authentification :
 *
 * 1. MasterAnnonceLogin : authentification classique username/password
 *    → Utilisé par POST /api/login
 *    → Vérifie les credentials en base de données
 *
 * 2. MasterAnnonceToken : authentification par token
 *    → Utilisé par le filtre de sécurité (AuthFilter) sur chaque requête protégée
 *    → Reconstitue l'identité (Subject) à partir du token
 */

MasterAnnonceLogin {
    org.univ_paris8.iut.montreuil.qdev.tp2025.gr07jeuquizz.tps6.rest.security.DbLoginModule required;
};

MasterAnnonceToken {
    org.univ_paris8.iut.montreuil.qdev.tp2025.gr07jeuquizz.tps6.rest.security.TokenLoginModule required;
};
